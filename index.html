<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Protein Purification: Vectors and Fusion Tags</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#F0F6F8;--ink:#0F2A33;--mut:#45626C;--card:#FFFFFF;--line:#C9DCE2;
  --prot:#2A6FF0;--his:#7C4DD6;--gst:#128A5C;--mbp:#C96A0A;--int:#D63D7C;--teal:#0E8C93;
  --junk:#93A6AD;--ni:#2FA866;--warn:#DC3F45;--yel:#F0B400;--reg:#5C7C99;--on:#FFFFFF;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0A1A20;--ink:#E8F3F5;--mut:#9DB7BF;--card:#12282F;--line:#274450;
    --prot:#6FA0FF;--his:#AE92FF;--gst:#3DD598;--mbp:#FFA340;--int:#FF73A8;--teal:#37C4CC;
    --junk:#6E858D;--ni:#4CD08A;--warn:#FF7479;--yel:#FFCB2E;--reg:#8DB0CC;--on:#08161B;
  }
}
:root[data-theme="dark"]{
  --bg:#0A1A20;--ink:#E8F3F5;--mut:#9DB7BF;--card:#12282F;--line:#274450;
  --prot:#6FA0FF;--his:#AE92FF;--gst:#3DD598;--mbp:#FFA340;--int:#FF73A8;--teal:#37C4CC;
  --junk:#6E858D;--ni:#4CD08A;--warn:#FF7479;--yel:#FFCB2E;--reg:#8DB0CC;--on:#08161B;
}
*{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;display:flex;flex-direction:column;background:var(--bg);color:var(--ink);
  font:400 clamp(15px,1.9vw,19px)/1.45 Figtree,"Segoe UI",system-ui,sans-serif;overflow:hidden;-webkit-text-size-adjust:100%}
main{flex:1;min-height:0;position:relative}
h1,h2,h3{font-family:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;margin:0}
.slide{position:absolute;inset:0;display:none;overflow-y:auto;overflow-x:hidden;padding:clamp(14px,2.6vw,36px) clamp(16px,5vw,64px) 28px;--c:var(--teal)}
.slide.active{display:block;animation:sfade .35s both}
.slide>*{max-width:1100px;margin-left:auto;margin-right:auto}
.t-his{--c:var(--his)}.t-gst{--c:var(--gst)}.t-mbp{--c:var(--mbp)}.t-int{--c:var(--int)}.t-pet{--c:var(--teal)}
.hd{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;margin-bottom:.5em}
h2{font-size:clamp(1.5rem,4.4vw,2.6rem);line-height:1.1;font-weight:800;letter-spacing:-.01em}
.pill{display:inline-flex;align-items:center;gap:.45em;border:1.5px solid var(--c);border-radius:99px;padding:.1em .8em;font-size:.82rem;font-weight:600;color:var(--ink);white-space:nowrap}
.pill::before{content:"";width:.6em;height:.6em;border-radius:50%;background:var(--c)}
.lead{font-size:clamp(1rem,2.2vw,1.3rem);color:var(--mut);margin:.2em 0 .8em}
.bl{list-style:none;padding:0;margin:.5em 0;display:grid;gap:.6em}
.bl li{position:relative;padding-left:1.4em;font-size:clamp(1rem,2.05vw,1.22rem);line-height:1.38}
.bl li::before{content:"";position:absolute;left:.15em;top:.5em;width:.58em;height:.58em;border-radius:50%;background:var(--c)}
.bl.sm li{font-size:clamp(.92rem,1.8vw,1.08rem)}
b,strong{font-weight:700}
.slide.active .b{animation:pop .5s both;animation-delay:calc(var(--n,0)*.3s + .15s)}
.two{display:grid;grid-template-columns:1fr;gap:18px;align-items:center}
@media(min-width:820px){.two{grid-template-columns:1fr 1fr}.two.l{grid-template-columns:1.2fr .8fr}.two.r{grid-template-columns:.85fr 1.15fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.card h3{font-size:1.15rem;margin-bottom:.3em}
.card.pro{border-top:5px solid var(--gst)}.card.con{border-top:5px solid var(--warn)}.card.tip{border-top:5px solid var(--yel)}
.card.pro,.card.con,.card.tip{border-radius:6px 6px 14px 14px}
.card .bl li::before{background:currentColor;opacity:.55}
.fig{display:block;width:100%;height:auto;max-height:min(58vh,460px);margin:auto}
.pl{fill:var(--ink);font:600 15px Figtree,sans-serif}
.lb{fill:var(--mut);font:600 13px Figtree,sans-serif}
.mt{fill:var(--mut);font:500 12px Figtree,sans-serif}
.tx{fill:var(--ink);font:600 12px Figtree,sans-serif;text-anchor:middle}
.wt{fill:#fff;font:700 13px Figtree,sans-serif;text-anchor:middle}
.note{font-size:.9rem;color:var(--mut)}
.leg{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.88rem;color:var(--mut);margin-top:10px}
.leg i{display:inline-block;width:.8em;height:.8em;border-radius:50%;margin-right:.35em;vertical-align:-.05em}

/* title */
.slide.active.title{display:flex;align-items:center;overflow:hidden}
.fls{position:absolute;inset:0;pointer-events:none;max-width:none!important;margin:0!important}
.fl{position:absolute;border-radius:50%;opacity:.2;animation:drift 9s ease-in-out infinite alternate}
.tt{position:relative;z-index:1}
.tt h1{font-size:clamp(2.3rem,9vw,5.4rem);font-weight:800;line-height:1;letter-spacing:-.02em}
.tt .sub{font-size:clamp(1.05rem,2.6vw,1.6rem);color:var(--mut);margin:.7em 0;max-width:34ch}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:1em 0}
.chip{border-radius:99px;padding:.3em .95em;font-weight:700;font-size:.95rem;color:var(--on);background:var(--c)}
.slide.active .chip{animation:popin .6s both;animation-delay:calc(var(--n)*.18s + .3s)}
.by{font-weight:600}.hint{color:var(--mut);font-size:.9rem}

/* roadmap */
.road{display:grid;gap:10px;margin-top:10px;padding:0;list-style:none}
.road li{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-left:8px solid var(--c);border-radius:10px;padding:10px 14px;font-size:clamp(1rem,2.1vw,1.2rem)}
.road small{display:block;color:var(--mut);font-size:.82rem}
.slide.active .road li{animation:pop .5s both;animation-delay:calc(var(--n)*.25s + .1s)}

/* flow */
.flow{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;list-style:none;padding:0;margin:12px 0;counter-reset:s}
.flow li{counter-increment:s;background:var(--card);border:2px solid var(--line);border-radius:12px;padding:10px 12px;font-size:.98rem;animation:glow 14s infinite;animation-delay:calc(var(--n)*2s)}
.flow li::before{content:counter(s);display:inline-grid;place-items:center;width:1.6em;height:1.6em;border-radius:50%;background:var(--teal);color:var(--on);font-weight:700;font-size:.85rem;margin-right:.5em}
.flow .em{display:block;font-size:1.7rem;margin-bottom:.15em}

/* cassette */
.cas{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.cb{padding:.45em .8em;border-radius:8px;border:2px solid var(--bc);background:color-mix(in srgb,var(--bc) 16%,var(--card));font-weight:600;font-size:.95rem;animation:lit 9s infinite;animation-delay:calc(var(--n)*1s)}

/* bars */
.bars{display:grid;gap:14px;margin:12px 0}
.barrow{display:grid;grid-template-columns:5.2rem 1fr;gap:4px 10px;align-items:center}
.barrow b{font-size:1rem}
.track{height:22px;background:color-mix(in srgb,var(--line) 70%,transparent);border-radius:6px;overflow:hidden}
.track i{display:block;height:100%;width:calc(var(--w)*1%);background:var(--c);border-radius:6px}
.slide.active .track i{animation:grow 1.3s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--n)*.3s)}
.barrow em{grid-column:2;font-style:normal;font-size:.9rem;color:var(--mut)}

/* seq */
.seq{font:600 clamp(.95rem,2.6vw,1.35rem)/1.5 ui-monospace,Menlo,Consolas,monospace;word-break:break-all;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.seq u{text-decoration:none;color:var(--on);background:var(--his);border-radius:4px;padding:0 .08em;animation:pulse2 1.8s ease-in-out infinite;animation-delay:calc(var(--n)*.12s)}

/* tables */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--card)}
table{border-collapse:collapse;width:100%;min-width:600px;font-size:clamp(.82rem,1.6vw,.98rem)}
th,td{padding:.55em .75em;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-weight:700}
tr:last-child td{border-bottom:0}
th.h1{border-top:5px solid var(--his)}th.h2{border-top:5px solid var(--gst)}th.h3{border-top:5px solid var(--mbp)}th.h4{border-top:5px solid var(--int)}
td:first-child{font-weight:700;color:var(--mut)}
code.k{font:600 .95em ui-monospace,Menlo,Consolas,monospace;background:color-mix(in srgb,var(--c) 14%,transparent);padding:.05em .35em;border-radius:5px}

/* steps widget */
.stp{display:grid;grid-template-columns:1fr;gap:14px;align-items:center}
@media(min-width:820px){.stp{grid-template-columns:1.15fr .85fr}}
.stp-btns{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.stp-btns button{font:600 .92rem Figtree,system-ui,sans-serif;border:1.5px solid var(--c);background:transparent;color:var(--ink);border-radius:99px;padding:.4em .9em;cursor:pointer}
.stp-btns button.on{background:var(--c);color:var(--on)}
.stp-btns button:focus-visible,.bar button:focus-visible,summary:focus-visible{outline:3px solid var(--yel);outline-offset:2px}
.stp-cap{margin:0;font-size:clamp(1rem,2vw,1.18rem);line-height:1.4;min-height:5.6em}

/* svg parts: stage visibility */
.s1,.s2,.s3{visibility:hidden}
.stp[data-stage="1"] .s1,.stp[data-stage="2"] .s2,.stp[data-stage="3"] .s3{visibility:visible}

/* column */
.col .tubebg{fill:var(--card);stroke:var(--ink);stroke-width:2.5;stroke-linejoin:round}
.col .bead{fill:var(--c);fill-opacity:.22;stroke:var(--c);stroke-width:1.5}
.col .tg{fill:var(--c)}.col .pr{fill:var(--prot)}.col .jk{fill:var(--junk)}
.col .tgt,.col .junk{opacity:0}
.col .stay{fill:var(--c);opacity:0}
.col .cup{fill:none;stroke:var(--ink);stroke-width:2}
.col .liq{fill:var(--junk);opacity:.7;transition:fill .5s}
.stp[data-stage="3"] .col .liq{fill:var(--prot)}
.col .drop{fill:var(--junk);animation:drip 1s var(--d) infinite}
.stp[data-stage="2"] .col .drop{fill:var(--teal)}
.stp[data-stage="3"] .col .drop{fill:var(--c)}
.stp[data-stage="1"] .col .junk{animation:fallOut 3.4s var(--d) infinite}
.stp[data-stage="2"] .col .junk.weak{animation:fallOut 3.4s var(--d) infinite}
.stp[data-stage="1"] .col .tgt{animation:bind 3.4s var(--d) infinite}
.stp[data-stage="2"] .col .tgt{opacity:1;transform:translateY(var(--rest))}
.stp[data-stage="3"] .col .tgt{animation:elute 3.6s var(--d) infinite}
.stp.cleave[data-stage="3"] .col .stay{opacity:1}
.stp.cleave[data-stage="3"] .col .tgt .tg{display:none}

/* T7 */
.t7 .box{fill:none;stroke:var(--line);stroke-width:2.5}
.t7 .gp{fill:var(--teal)}.t7 .gn{fill:var(--int)}.t7 .gy{fill:var(--prot)}.t7 .gt{fill:var(--reg)}
.t7 .bt{fill:#fff;font:700 12px Figtree,sans-serif;text-anchor:middle}
.t7 .lac{transition:transform 1.2s ease,opacity 1.2s ease}
.t7 .lac polygon{fill:var(--warn)}
.t7 .lac text{fill:#fff;font:700 10px Figtree,sans-serif;text-anchor:middle}
.t7 .ip{fill:var(--yel);opacity:0;transition:opacity .8s}
.stp:not([data-stage="1"]) .t7 .ip{opacity:1}
.stp:not([data-stage="1"]) .t7 .lac{transform:translateY(-30px);opacity:.55}
.t7 .rn{fill:var(--int);opacity:0}
.stp[data-stage="3"] .t7 .rn{animation:rnap 3s var(--d) infinite}
.t7 .mrna{fill:none;stroke:var(--int);stroke-width:3;stroke-linecap:round;stroke-dasharray:100;stroke-dashoffset:100;opacity:0}
.stp[data-stage="3"] .t7 .mrna{opacity:1;animation:draw 2.6s linear infinite}
.t7 .pdot{fill:var(--prot);opacity:0}
.stp[data-stage="3"] .t7 .pdot{animation:popup 1.8s var(--d) infinite}

/* His close-up */
.his .beadbig{fill:var(--junk);fill-opacity:.2;stroke:var(--junk);stroke-width:2}
.his .nta{fill:var(--card);stroke:var(--ink);stroke-width:2}
.his .ni{fill:var(--ni)}
.his .pr{fill:var(--prot)}
.his .ringh{fill:var(--his)}.his .ringi{fill:var(--yel)}
.his .chain{transition:transform 1.1s cubic-bezier(.5,0,.2,1)}
.stp[data-stage="1"] .his .chain,.stp[data-stage="3"] .his .chain{transform:translate(40px,-85px)}
.his .imid{opacity:0;transform:translateX(60px);transition:opacity .9s,transform .9s}
.stp[data-stage="3"] .his .imid{opacity:1;transform:none}
.his .bond{stroke:var(--ni);stroke-width:2.5;stroke-dasharray:3 3;opacity:0;transition:opacity .6s}
.stp:not([data-stage="1"]) .his .bond{opacity:1}
.his .site0{fill:none;stroke:var(--ni);stroke-dasharray:3 3}

/* protease + splicing: groups rotate about their own centre */
.prt g,.spl g{transform-box:fill-box;transform-origin:center}
.prt .tagb{fill:var(--c)}.prt .site{fill:var(--yel)}.prt .pb{fill:var(--prot)}
.prt .g1,.prt .g2{transition:transform 1s ease}
.stp[data-stage="3"] .prt .g1{transform:translate(-34px,-16px) rotate(-5deg)}
.stp[data-stage="3"] .prt .g2{transform:translate(34px,10px) rotate(3deg)}
.prt .sc{opacity:0;transform:translateY(-30px);transition:transform .8s,opacity .8s;font-size:34px;fill:var(--ink)}
.stp[data-stage="2"] .prt .sc{opacity:1;transform:translateY(0)}
.prt .cut{stroke:var(--warn);stroke-width:2.5;stroke-dasharray:4 3;opacity:0;transition:opacity .5s}
.stp[data-stage="2"] .prt .cut{opacity:1}
.spl .nb{fill:var(--prot)}.spl .cb2{fill:var(--prot);fill-opacity:.7}.spl .ib{fill:var(--int)}
.spl .itn{transition:transform 1.1s ease,opacity 1.1s ease}
.stp[data-stage="2"] .spl .itn{transform:translateY(-62px)}
.stp[data-stage="3"] .spl .itn{transform:translate(18px,-92px) rotate(8deg);opacity:.5}
.spl .cex{transition:transform 1.1s .25s ease}
.stp[data-stage="3"] .spl .cex{transform:translateX(-120px)}
.spl .bondc{fill:var(--yel);stroke:var(--ink)}

/* maps */
.plas .ring0{fill:none;stroke:var(--line);stroke-width:24;opacity:.6}
.plas .arc{fill:none;stroke-width:24;stroke-dasharray:100;stroke-dashoffset:100}
.slide.active .plas .arc{animation:drawArc .9s ease-out both;animation-delay:calc(var(--i)*.25s)}
.slide.active .plas .arc.gene{animation:drawArc .9s ease-out both,pulse 2.2s ease-in-out 2.6s infinite;animation-delay:calc(var(--i)*.25s),2.6s}
.plas .lead{stroke:var(--mut);stroke-width:1}
.plas .pl{font-size:15px}
.plas .nm{font:800 18px "Bricolage Grotesque",system-ui,sans-serif;fill:var(--ink);text-anchor:middle}
.plas .sb{font:500 12px Figtree,sans-serif;fill:var(--mut);text-anchor:middle}
.slide.active .plas .pl,.slide.active .plas .lead{animation:pop .5s both;animation-delay:calc(var(--i)*.25s + .5s)}

/* misc figs */
.dot{fill:var(--junk);opacity:.55;animation:bob 4s ease-in-out infinite alternate}
.me{fill:var(--prot)}.ping{fill:none;stroke:var(--prot);stroke-width:3;transform-box:fill-box;transform-origin:center;animation:ping 1.8s ease-out infinite}
.resin{fill:var(--c);fill-opacity:.18;stroke:var(--c);stroke-width:2}
.recep{fill:none;stroke:var(--c);stroke-width:5;stroke-linecap:round}
.trav{animation:travel 6s ease-in-out infinite}
.tagr{fill:var(--c)}
.gs{fill:var(--gst)}.pocket{fill:var(--bg);stroke:var(--gst);stroke-width:2}
.gsh rect{fill:var(--yel)}.gsh text{fill:#1b2a30;font:700 9px Figtree,sans-serif;text-anchor:middle}
.gsh{animation:gshIn 3s ease-in-out infinite alternate}
.mb{fill:var(--mbp)}.bl2{fill:var(--prot)}
.cl{animation:clump 2.4s ease-in-out infinite alternate}
.bobs{animation:bob 2s ease-in-out infinite alternate}

/* details/quiz */
details{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin:8px 0}
summary{cursor:pointer;font-weight:600}
details p{margin:.5em 0 0;color:var(--mut)}
.arrowrow{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin:10px 0}
.arrowrow span{background:var(--card);border:1.5px solid var(--c);border-radius:99px;padding:.25em .8em;font-size:.92rem}
.arrowrow s{text-decoration:none;color:var(--mut)}
.mn{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:12px 0}
.mn div{border-radius:12px;padding:12px;background:color-mix(in srgb,var(--c) 14%,var(--card));border:2px solid var(--c)}
.mn b{display:block;font-family:"Bricolage Grotesque",system-ui,sans-serif;font-size:1.6rem}
.dec{display:grid;gap:10px}
.dec div{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;background:var(--card);border:1px solid var(--line);border-left:8px solid var(--c);border-radius:10px;padding:10px 14px}
.dec span{flex:1 1 220px}.dec strong{color:var(--ink)}
.slide.active .dec div{animation:pop .5s both;animation-delay:calc(var(--n)*.25s + .1s)}

/* bar */
.bar{display:flex;align-items:center;gap:10px;padding:8px 12px;border-top:1px solid var(--line);background:var(--card);position:relative}
.prog{position:absolute;left:0;top:-3px;height:3px;width:100%}
.prog i{display:block;height:100%;width:0;background:var(--teal);transition:width .3s}
.bar button{font:700 1.1rem Figtree,system-ui,sans-serif;min-width:44px;height:40px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}
#cnt{flex:1;text-align:center;font-weight:600;color:var(--mut);font-size:.9rem}
#notes{font-size:.9rem;padding:0 12px}
#note{display:none;position:absolute;left:0;right:0;bottom:0;background:var(--ink);color:var(--bg);padding:12px 18px;font-size:1rem;z-index:5;max-height:35%;overflow:auto}
body.notes #note{display:block}

@keyframes sfade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:translateX(-14px)}to{opacity:1;transform:none}}
@keyframes popin{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:none}}
@keyframes drawArc{from{stroke-dashoffset:100}to{stroke-dashoffset:0}}
@keyframes pulse{0%,100%{stroke-width:24}50%{stroke-width:31}}
@keyframes pulse2{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes grow{from{width:0}}
@keyframes drip{0%{transform:translateY(0);opacity:1}100%{transform:translateY(16px);opacity:0}}
@keyframes fallOut{0%{transform:translateY(0);opacity:0}10%{opacity:1}85%{opacity:1}100%{transform:translateY(262px);opacity:0}}
@keyframes bind{0%{transform:translateY(0);opacity:0}12%{opacity:1}70%,100%{transform:translateY(var(--rest));opacity:1}}
@keyframes elute{0%,12%{transform:translateY(var(--rest));opacity:1}78%{transform:translateY(262px);opacity:1}100%{transform:translateY(262px);opacity:0}}
@keyframes rnap{0%{transform:translate(0,0);opacity:0}12%{opacity:1}85%{transform:translate(var(--dx),130px);opacity:1}100%{transform:translate(var(--dx),130px);opacity:0}}
@keyframes draw{from{stroke-dashoffset:100}to{stroke-dashoffset:0}}
@keyframes popup{0%{transform:translateY(12px);opacity:0}40%,80%{transform:none;opacity:1}100%{opacity:0}}
@keyframes drift{from{transform:translate(0,0)}to{transform:translate(30px,-40px)}}
@keyframes bob{to{transform:translate(var(--dx,6px),var(--dy,-6px))}}
@keyframes ping{0%{transform:scale(.6);opacity:.9}100%{transform:scale(3.2);opacity:0}}
@keyframes lit{0%{background:color-mix(in srgb,var(--bc) 60%,var(--card))}11%{background:color-mix(in srgb,var(--bc) 60%,var(--card))}12%,100%{background:color-mix(in srgb,var(--bc) 16%,var(--card))}}
@keyframes glow{0%{border-color:var(--teal);transform:scale(1.04);background:color-mix(in srgb,var(--teal) 14%,var(--card))}13%{border-color:var(--teal);transform:scale(1.04);background:color-mix(in srgb,var(--teal) 14%,var(--card))}15%,100%{border-color:var(--line);transform:none;background:var(--card)}}
@keyframes travel{0%{transform:translateX(0);opacity:0}10%{opacity:1}60%,88%{transform:translateX(308px);opacity:1}100%{transform:translateX(308px);opacity:0}}

/* ---------- plasmid map generator ---------- */
function plasmid(m){
  const cx=200,cy=170,r=90;
  const P=(d,rad)=>{const t=d*Math.PI/180;return [cx+rad*Math.sin(t),cy-rad*Math.cos(t)]};
  let s=`<svg viewBox="-70 -10 540 360" class="fig plas" role="img" aria-label="Schematic map of ${m.name}"><circle class="ring0" cx="200" cy="170" r="90"/>`;
  m.seg.forEach(([a,b,c,l,g],i)=>{
    const [x1,y1]=P(a,r),[x2,y2]=P(b,r);
    s+=`<path d="M${x1.toFixed(1)} ${y1.toFixed(1)}A${r} ${r} 0 ${(b-a)>180?1:0} 1 ${x2.toFixed(1)} ${y2.toFixed(1)}" class="arc${g?' gene':''}" style="stroke:var(--${c});--i:${i}" pathLength="100"/>`;
    const mid=(a+b)/2,sn=Math.sin(mid*Math.PI/180),cs=Math.cos(mid*Math.PI/180);
    const [lx,ly]=P(mid,r+32),[tx,ty]=P(mid,r+14),[ux,uy]=P(mid,r+26);
    const an=sn>.25?'start':sn<-.25?'end':'middle';
    s+=`<line class="lead" x1="${tx.toFixed(1)}" y1="${ty.toFixed(1)}" x2="${ux.toFixed(1)}" y2="${uy.toFixed(1)}" style="--i:${i}"/><text class="pl" text-anchor="${an}" x="${(lx+(an==='start'?3:an==='end'?-3:0)).toFixed(1)}" y="${(ly+(cs>.3?0:cs<-.3?11:5)).toFixed(1)}" style="--i:${i}">${l}</text>`;
  });
  s+=`<text class="nm" x="200" y="168">${m.name}</text><text class="sb" x="200" y="188">${m.sub||'schematic, not to scale'}</text></svg>`;
  return s;
}

function colSvg(elab){

  const st=T.map(([x,rest])=>`<rect class="stay" x="${x-5}" y="${57+rest}" width="10" height="6" rx="2"/>`).join('');
  const J=[[95,0,0],[112,.5,1],[130,.9,0],[146,.3,1],[164,.7,0]];

  const dr=[105,130,155].map((x,i)=>`<circle class="drop" cx="${x}" cy="28" r="3.5" style="--d:${i*.3}s"/>`).join('');
  return `<svg viewBox="0 0 260 335" class="fig col" role="img" aria-label="Animated affinity column"><path class="tubebg" d="M85 36V260L122 288H138L175 260V36"/>${beads}${jk}${tg}${st}<path class="cup" d="M104 292H156L151 326H109Z"/><rect class="liq" x="111" y="310" width="38" height="14" rx="2"/>${dr}<text class="pl s1" x="130" y="16" text-anchor="middle">Crude lysate</text><text class="pl s2" x="130" y="16" text-anchor="middle">Wash buffer</text><text class="pl s3" x="130" y="16" text-anchor="middle">${elab}</text></svg>`;
}

/* ====================== ENGINE ====================== */
const deck=document.getElementById('deck'),cnt=document.getElementById('cnt'),prog=document.getElementById('prog'),note=document.getElementById('note');
deck.insertAdjacentHTML('afterbegin',slides.map((s,i)=>`<section class="slide ${s.cls}" data-i="${i}">${s.html}</section>`).join(''));
const els=[...deck.querySelectorAll('.slide')];

els.forEach(root=>root.querySelectorAll('.stp').forEach(el=>{
  const steps=JSON.parse(el.dataset.steps),btns=el.querySelector('.stp-btns'),cap=el.querySelector('.stp-cap');
  btns.innerHTML=steps.map((s,i)=>`<button type="button" data-s="${i+1}">${s.t}</button>`).join('');
  let timer=null,cur=1;
  const set=n=>{cur=n;el.dataset.stage=n;[...btns.children].forEach((b,i)=>b.classList.toggle('on',i+1===n));cap.innerHTML=steps[n-1].d};
  el._start=()=>{set(1);clearInterval(timer);if(!reduced)timer=setInterval(()=>set(cur%steps.length+1),5200)};
  el._stop=()=>clearInterval(timer);
  btns.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;clearInterval(timer);set(+b.dataset.s)});
  set(1);
}));

let cur=-1;
function show(i){
  i=Math.max(0,Math.min(slides.length-1,i));
  if(cur>=0){els[cur].classList.remove('active');els[cur].querySelectorAll('.stp').forEach(w=>w._stop())}
  cur=i;const e=els[i];e.classList.add('active');e.scrollTop=0;
  e.querySelectorAll('.stp').forEach(w=>w._start());
  cnt.textContent=(i+1)+' / '+slides.length;prog.style.width=((i+1)/slides.length*100)+'%';
  note.textContent=slides[i].note||'';
  try{history.replaceState(null,'','#'+(i+1))}catch(_){}
}
const go=d=>show(cur+d);
document.getElementById('next').onclick=()=>go(1);
document.getElementById('prev').onclick=()=>go(-1);
document.getElementById('notes').onclick=()=>document.body.classList.toggle('notes');
document.addEventListener('keydown',e=>{
  if(e.target.closest&&e.target.closest('summary'))return;
  if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();go(1)}
  else if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();go(-1)}
  else if(e.key==='Home')show(0);else if(e.key==='End')show(slides.length-1);
  else if(e.key==='n'||e.key==='N')document.body.classList.toggle('notes');
  else if(e.key==='f'||e.key==='F'){try{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()}catch(_){}}
});
let sx=0,sy=0,skip=false;
deck.addEventListener('touchstart',e=>{const t=e.touches[0];sx=t.clientX;sy=t.clientY;skip=!!e.target.closest('.tw,.stp-btns,details')},{passive:true});
deck.addEventListener('touchend',e=>{if(skip)return;const t=e.changedTouches[0],dx=t.clientX-sx,dy=t.clientY-sy;if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)*1.5)go(dx<0?1:-1)},{passive:true});
show((parseInt(location.hash.slice(1))||1)-1);
</script>
